name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile bin/studydash
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Manifest is valid JSON
        run: python -c "import json; json.load(open('manifest.json'))"
